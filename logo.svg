<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Zentrevo Logo — Travel/Mountain/Sun/Airplane -->
  <defs>
    <linearGradient id="arc-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1AABB8"/>
      <stop offset="100%" stop-color="#0E7C8B"/>
    </linearGradient>
    <linearGradient id="mtn-grad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#1E2D4F"/>
      <stop offset="100%" stop-color="#15203A"/>
    </linearGradient>
  </defs>
  <!-- Sweeping arc -->
  <path d="M80 420 C60 260, 120 100, 256 60 C180 130, 140 240, 130 370 Q120 400, 80 420Z" fill="url(#arc-grad)"/>
  <path d="M100 440 C90 320, 130 180, 240 100 C170 170, 150 280, 148 390 Q140 420, 100 440Z" fill="url(#arc-grad)" opacity="0.5"/>
  <!-- Mountains -->
  <path d="M160 400 L260 230 L310 310 L340 260 L440 400Z" fill="url(#mtn-grad)"/>
  <path d="M200 400 L290 270 L330 330 L360 290 L430 400Z" fill="#1E2D4F" opacity="0.6"/>
  <!-- Sun -->
  <circle cx="310" cy="175" r="42" fill="#F5B731"/>
  <!-- Birds -->
  <g fill="none" stroke="#1E2D4F" stroke-width="5" stroke-linecap="round">
    <path d="M370 165 Q378 155, 386 165"/>
    <path d="M395 145 Q403 135, 411 145"/>
    <path d="M410 170 Q416 162, 422 170"/>
  </g>
  <!-- River -->
  <path d="M265 400 Q280 350, 310 340 Q340 330, 330 370 Q320 400, 360 400" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
  <path d="M275 400 Q290 360, 315 350 Q340 340, 335 375 Q328 400, 355 400" fill="none" stroke="#B8E4EA" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <!-- Airplane -->
  <g transform="translate(350, 90) rotate(-30)">
    <path d="M0 0 L-30 15 L-15 5 L-50 20 L-15 0 L-50 -20 L-15 -5 L-30 -15Z" fill="#1AABB8"/>
  </g>
</svg>
